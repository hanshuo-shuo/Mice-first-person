experiment_id: sac_matched_generalization
seed: 2026082401
output_root: results/sac_matched
reward_function: first_person_sac_reward
matched_condition: active

environment:
  world_name: "21_05"
  use_predator: true
  max_step: 300
  time_step: 0.10
  predator_prey_forward_speed_ratio: 0.15
  vision_width: 64
  vision_height: 48
  vision_fov: 120.0
  vision_far_clip: 2.0
  vision_detection_range: 2.0
  observation_mode: mouse
  action_mode: egocentric_velocity_head
  passive_gaze_mode: center
  fixed_head_yaw_degrees: 0.0
  passive_scan_targets_degrees: [-60, -30, 0, 30, 60, 30, 0, -30]
  passive_scan_dwell_steps: 2

task_distribution:
  manifest_root: configs/tasksets/matched_v1
  train_split: train
  validation_split: validation
  test_split: test

matched_training:
  conditions: [active, fixed_center, fixed_p60, fixed_scan]
  seeds: [2026082401, 2026082402, 2026082403, 2026082404, 2026082405]

policy:
  image_features_dim: 128
  vector_features_dim: 32
  net_arch: [256, 256]
  share_features_extractor: false

training:
  total_timesteps: 400000
  num_envs: 4
  buffer_size: 200000
  learning_starts: 20000
  batch_size: 128
  learning_rate: 0.0003
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 2
  ent_coef: auto
  target_update_interval: 1
  checkpoint_freq: 100000
  eval_freq: 200000
  eval_episodes: 256
  log_interval: 10
  device: cuda
  require_cuda: true

evaluation:
  split: test
  gif_fps: 10.0
  render_scale: 3
