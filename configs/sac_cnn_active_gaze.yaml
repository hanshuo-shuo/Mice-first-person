experiment_id: sac_cnn_active_gaze
seed: 20260819
output_root: results/sac
reward_function: first_person_sac_reward

environment:
  world_name: "21_05"
  use_predator: true
  max_step: 300
  time_step: 0.10
  predator_prey_forward_speed_ratio: 0.15
  vision_width: 64
  vision_height: 48
  vision_fov: 120.0
  vision_far_clip: 2.0
  vision_detection_range: 2.0
  observation_mode: mouse
  action_mode: egocentric_velocity_head

policy:
  image_features_dim: 128
  vector_features_dim: 32
  net_arch: [256, 256]
  share_features_extractor: false

training:
  total_timesteps: 300000
  num_envs: 4
  buffer_size: 75000
  learning_starts: 10000
  batch_size: 128
  learning_rate: 0.0003
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 2
  ent_coef: auto
  target_update_interval: 1
  checkpoint_freq: 50000
  eval_freq: 50000
  eval_episodes: 10
  log_interval: 10
  device: cuda
  require_cuda: true

evaluation:
  episodes: 40
  seed_start: 900000
  gif_fps: 10.0
  render_scale: 3
