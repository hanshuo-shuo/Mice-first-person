experiment_id: exp01_perception_action_gap_pilot
seed: 20260819
num_snapshots: 15
output_root: results/peekbench

environment:
  world_name: "21_05"
  max_step: 200
  time_step: 0.10
  predator_prey_forward_speed_ratio: 0.15
  vision_width: 64
  vision_height: 48
  vision_fov: 120.0
  vision_far_clip: 2.0
  vision_detection_range: 2.0

sampling:
  # Fifteen states balance the five operational categories and three sources.
  # This is a small exploratory pilot, not a powered confirmatory sample.
  sources: [near_occlusion, junction, peek_location]
  categories:
    - predator_visible
    - geometric_outside_frustum
    - frustum_pixel_occluded
    - recently_visible_hidden
    - no_predator_control
  minimum_predator_distance: 0.16
  maximum_predator_distance: 0.80
  recent_visibility_horizon: 8
  candidate_search_limit: 64

gaze_candidates_degrees: [-60, -30, 0, 30, 60]

branch:
  horizon_steps: 8
  risk_distance: 0.18
  minimum_distance_improvement: 0.03

headroom:
  horizon_steps: 40
  risk_distance: 0.18
  random_replicates: 5
  random_target_hold_steps: 4
  scan_dwell_steps: 1
  target_tolerance_degrees: 2.0
  active_look_degrees_threshold: 1.0
  privileged_danger_distance: 0.34
  go:
    minimum_predator_snapshots: 12
    minimum_fixed_failure_fraction: 0.20
    minimum_stable_headroom_fraction: 0.10
    minimum_recovery_fraction_of_fixed_failures: 0.50
    minimum_stable_recoveries: 2
    minimum_safe_nonzero_gaze_candidates: 2

exp01:
  # Every semantic action lasts four seconds at dt=0.1. The closed-loop VLM
  # updates every 0.8 seconds; low-level head target tracking remains legal.
  require_remote_policy: true
  horizon_steps: 40
  macro_horizon_steps: 8
  look_probe_steps: 3
  decision_interval_steps: 8
  risk_distance: 0.18
  risk_threshold: 0.50
  target_tolerance_degrees: 2.0
  privileged_danger_distance: 0.34

policy:
  # Exact model/provider routing is part of the experiment identity.
  model: openai/gpt-4.1-mini
  provider:
    order: [openai]
    allow_fallbacks: false
    require_parameters: true
    data_collection: deny
  timeout_seconds: 30
  max_retries: 2
  retry_backoff_seconds: 0.5
  max_history_frames: 4
